name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a field Shopify deprecates or removes — or a new security
  # advisory in a dependency — is noticed even when nothing was pushed.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Make the schema-validation test fail instead of skip when the schema is
  # missing, so a green build always means the queries were checked.
  SHOPIFY_SCHEMA_REQUIRED: '1'

jobs:
  tests:
    name: tests (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
        env:
          # Authenticated package downloads: anonymous ones from GitHub get
          # rate limited (HTTP 429) every so often and fail the build.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate composer.json
        run: composer validate --strict

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        # Retried: a download that fails on a busy mirror usually works a moment later.
        run: |
          for attempt in 1 2 3; do
            composer install --no-interaction --no-progress && exit 0
            echo "composer install failed (attempt $attempt); retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Security advisories
        run: composer audit --abandoned=report

      - name: Static analysis
        run: composer stan

      - name: Download Shopify schema
        run: composer schema

      - name: Tests
        run: composer test

  # The package must work on the oldest versions composer.json allows, not just
  # the newest ones a fresh install happens to pick.
  lowest-dependencies:
    name: tests (8.3, lowest dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the lowest allowed dependencies
        run: |
          for attempt in 1 2 3; do
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress && exit 0
            echo "composer update failed (attempt $attempt); retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Download Shopify schema
        run: composer schema

      - name: Tests
        run: composer test
