name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer install --no-interaction --no-progress

      - name: Static analysis
        run: composer stan

      # Lets the schema-validation test run; if Shopify's endpoint is
      # unreachable that one test is skipped rather than failing the build.
      - name: Download Shopify schema
        run: composer schema
        continue-on-error: true

      - name: Tests
        run: composer test
